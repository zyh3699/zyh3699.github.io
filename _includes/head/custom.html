<!-- ── 白金风格点缀 ── -->
<style>
/* h1 分隔线：金色渐变从中间向两侧展开 */
.page__content h1 {
  border-bottom: none !important;
  position: relative;
}
.page__content h1::after {
  content: '';
  display: block;
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 0%, #a07830 20%, #f0c860 50%, #a07830 80%, transparent 100%
  );
  transform: scaleX(0);
  transform-origin: center;
  transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
}
.page__content h1.gold-line-in::after {
  transform: scaleX(1);
}

/* 引用数金色徽章 */
.cite-badge {
  display: inline-block;
  background: linear-gradient(135deg, #7a5c1a, #c9a84c);
  color: #fff8e8 !important;
  font-size: 0.75em;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 10px;
  margin-left: 4px;
  vertical-align: middle;
  box-shadow: 0 0 6px rgba(201,168,76,0.3);
  letter-spacing: 0.03em;
}

/* 页面入场淡入 */
@keyframes pageEnter {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
#main {
  animation: pageEnter 0.6s cubic-bezier(0.4, 0, 0.2, 1) both;
}

/* 极淡金色斜线纹理 */
body {
  background-image: repeating-linear-gradient(
    45deg,
    transparent,
    transparent 28px,
    rgba(180, 140, 40, 0.045) 28px,
    rgba(180, 140, 40, 0.045) 29px
  ) !important;
}

/* 金色关键帧 */
@keyframes sparkFade {
  0%   { opacity: 0.85; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0;    transform: translate(-50%,-50%) scale(0.1); }
}
@keyframes badgeShine {
  0%   { left: -120%; }
  100% { left: 220%; }
}
@keyframes avatarGlow {
  0%,100% { box-shadow: 0 0 0 2px #c9a84c55, 0 0 10px #c9a84c22; }
  50%      { box-shadow: 0 0 0 3px #c9a84c99, 0 0 18px #c9a84c44; }
}

/* 作者名与头像居中对齐 */
.author__avatar,
.author__content {
  text-align: center !important;
}

/* 头像金边 */
.author__avatar img {
  border: 2px solid #c9a84c !important;
  border-radius: 50% !important;
  animation: avatarGlow 3.5s ease-in-out infinite;
  transition: transform 0.3s ease;
}
.author__avatar img:hover {
  transform: scale(1.04);
}

/* Badge 金色（保留原来 position:absolute 定位，只换颜色+加扫光） */
@keyframes goldFlow {
  0%   { background-position: 0% center; }
  100% { background-position: 200% center; }
}
.badge {
  background: linear-gradient(135deg, #7a5c1a, #c9a84c, #7a5c1a) !important;
  background-size: 200% auto !important;
  animation: goldFlow 4s linear infinite !important;
  color: #fff8e8 !important;
  border: none !important;
  overflow: hidden !important;
  /* position/margin/padding 全部保持原样，不覆盖 */
}
.badge::after {
  content: '';
  position: absolute;
  top: 0; left: -120%;
  width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
  animation: badgeShine 3s 1s linear infinite;
}

/* 链接悬停金色光晕（不改颜色，只加 glow） */
.page__content a:hover {
  text-shadow: 0 0 8px rgba(201,168,76,0.35) !important;
}

/* 列表项悬停：放大 + 圆点变金色 */
.page__content ul li {
  transition: transform 0.2s ease;
}
.page__content ul li:hover {
  transform: scale(1.02);
}
.page__content ul li::marker {
  color: inherit;
  transition: color 0.2s ease;
}
.page__content ul li:hover::marker {
  color: #c9a84c;
}

/* 隐藏原有灰色条形（::before），只用金色 ::after */
.greedy-nav .visible-links a::before {
  display: none !important;
}
/* 导航链接悬停 + active 金色下划线 */
.greedy-nav .visible-links a {
  position: relative;
  text-decoration: none !important;
}
.greedy-nav .visible-links a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, #c9a84c, transparent);
  transition: width 0.3s ease;
}
.greedy-nav .visible-links a:hover::after,
.greedy-nav .visible-links a.nav-active::after {
  width: 100%;
}
.greedy-nav .visible-links a.nav-active {
  color: #c9a84c !important;
}

/* 鼠标金火花 */
.g-spark {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  animation: sparkFade 0.7s ease forwards;
}
</style>

<script>
(function () {

  /* ── 导航 active 高亮 ── */
  document.addEventListener('DOMContentLoaded', function () {
    var headings = document.querySelectorAll('.page__content h1');
    var navLinks = document.querySelectorAll('.greedy-nav .visible-links .masthead__menu-item a');
    if (!navLinks.length) return;

    var mastheadH = (document.querySelector('.masthead') || {}).offsetHeight || 60;

    // 找文字精确为 "About Me" 的 nav 链接
    var aboutLink = navLinks[0];
    for (var i = 0; i < navLinks.length; i++) {
      if (navLinks[i].textContent.trim().toLowerCase() === 'about me') {
        aboutLink = navLinks[i]; break;
      }
    }

    // 收集 h1 信息
    var sections = Array.from(headings).map(function (h) {
      return { el: h, text: h.textContent.replace(/\s+/g, ' ').trim() };
    });

    function findNavForSection(sectionText) {
      var st = sectionText.toLowerCase();
      for (var i = 0; i < navLinks.length; i++) {
        var nt = navLinks[i].textContent.toLowerCase().trim();
        if (!nt) continue;
        if (st.indexOf(nt) !== -1 || nt.split(/\s/)[0].length > 2 && st.indexOf(nt.split(/\s/)[0]) !== -1) {
          return navLinks[i];
        }
      }
      return null;
    }

    var activeLink = null;
    function setActive(link) {
      if (activeLink === link) return;
      navLinks.forEach(function (a) { a.classList.remove('nav-active'); });
      if (link) link.classList.add('nav-active');
      activeLink = link;
    }

    function update() {
      var scrollY = window.scrollY || window.pageYOffset;
      var trigger = scrollY + mastheadH + 20;
      var current = null;
      sections.forEach(function (s) {
        if (s.el.getBoundingClientRect().top + scrollY <= trigger) current = s;
      });
      setActive(current ? (findNavForSection(current.text) || aboutLink) : aboutLink);
    }

    // 点击立即生效；trackpad 惯性 wheel 在点击后 400ms 内不覆盖
    var userScrolling = false;
    var lastClickTime = 0;

    window.addEventListener('wheel', function () {
      if (Date.now() - lastClickTime > 400) userScrolling = true;
    }, { passive: true });
    window.addEventListener('touchmove', function () { userScrolling = true; }, { passive: true });
    window.addEventListener('keydown', function (e) {
      if ([32,33,34,35,36,38,40].indexOf(e.keyCode) !== -1) userScrolling = true;
    });

    navLinks.forEach(function (link) {
      link.addEventListener('click', function () {
        lastClickTime = Date.now();
        userScrolling = false;
        setActive(link);
      });
    });

    window.addEventListener('scroll', function () {
      if (userScrolling) update();
    }, { passive: true });

    update();
  });

  /* ── h1 分隔线展开动画 ── */
  document.addEventListener('DOMContentLoaded', function () {
    var h1s = document.querySelectorAll('.page__content h1');
    var lineObs = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add('gold-line-in');
          lineObs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });
    h1s.forEach(function (h) { lineObs.observe(h); });
  });

  /* ── 鼠标金火花 ── */
  var COLORS = ['#ffe8a0','#f0c860','#c9a84c','#ffd060','#e8b840'];
  var last = 0;
  document.addEventListener('mousemove', function (e) {
    var now = Date.now();
    if (now - last < 45) return;
    last = now;
    var s = document.createElement('div');
    s.className = 'g-spark';
    var sz = (Math.random() * 5 + 2).toFixed(1);
    var c  = COLORS[Math.floor(Math.random() * COLORS.length)];
    s.style.cssText =
      'left:' + e.clientX + 'px;top:' + e.clientY + 'px;' +
      'width:' + sz + 'px;height:' + sz + 'px;' +
      'background:' + c + ';box-shadow:0 0 5px ' + c + ';';
    document.body.appendChild(s);
    setTimeout(function () { s.parentNode && s.parentNode.removeChild(s); }, 750);
  });
})();
</script>
