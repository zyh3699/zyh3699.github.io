<!-- ── 白金风格点缀 ── -->
<style>
/* 金色关键帧 */
@keyframes sparkFade {
  0%   { opacity: 0.85; transform: translate(-50%,-50%) scale(1); }
  100% { opacity: 0;    transform: translate(-50%,-50%) scale(0.1); }
}
@keyframes badgeShine {
  0%   { left: -120%; }
  100% { left: 220%; }
}
@keyframes avatarGlow {
  0%,100% { box-shadow: 0 0 0 2px #c9a84c55, 0 0 10px #c9a84c22; }
  50%      { box-shadow: 0 0 0 3px #c9a84c99, 0 0 18px #c9a84c44; }
}

/* 头像金边 */
.author__avatar img {
  border: 2px solid #c9a84c !important;
  border-radius: 50% !important;
  animation: avatarGlow 3.5s ease-in-out infinite;
  transition: transform 0.3s ease;
}
.author__avatar img:hover {
  transform: scale(1.04);
}

/* Badge 金色（保留原来 position:absolute 定位，只换颜色+加扫光） */
@keyframes goldFlow {
  0%   { background-position: 0% center; }
  100% { background-position: 200% center; }
}
.badge {
  background: linear-gradient(135deg, #7a5c1a, #c9a84c, #7a5c1a) !important;
  background-size: 200% auto !important;
  animation: goldFlow 4s linear infinite !important;
  color: #fff8e8 !important;
  border: none !important;
  overflow: hidden !important;
  /* position/margin/padding 全部保持原样，不覆盖 */
}
.badge::after {
  content: '';
  position: absolute;
  top: 0; left: -120%;
  width: 50%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
  animation: badgeShine 3s 1s linear infinite;
}

/* 链接悬停金色光晕（不改颜色，只加 glow） */
.page__content a:hover {
  text-shadow: 0 0 8px rgba(201,168,76,0.35) !important;
}

/* 列表项悬停：放大 + 圆点变金色 */
.page__content ul li {
  transition: transform 0.2s ease;
}
.page__content ul li:hover {
  transform: scale(1.02);
}
.page__content ul li::marker {
  color: inherit;
  transition: color 0.2s ease;
}
.page__content ul li:hover::marker {
  color: #c9a84c;
}

/* 导航当前 section 金色高亮 */
.masthead__menu-item a.nav-active {
  color: #c9a84c !important;
}
.masthead__menu-item a.nav-active::after {
  width: 100% !important;
  background: linear-gradient(90deg, transparent, #c9a84c, transparent) !important;
}

/* 鼠标金火花 */
.g-spark {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  animation: sparkFade 0.7s ease forwards;
}
</style>

<script>
(function () {

  /* ── 导航 active 高亮 ── */
  document.addEventListener('DOMContentLoaded', function () {
    var headings = document.querySelectorAll('.page__content h1');
    var navLinks = document.querySelectorAll('.masthead__menu-item a');
    if (!headings.length || !navLinks.length) return;

    // 建立 heading 文字 → nav 链接的映射（按包含关键词匹配）
    var sections = Array.from(headings).map(function (h) {
      return { el: h, text: h.textContent.toLowerCase() };
    });

    function matchNav(sectionText) {
      // 尝试找 href 含 hash 且文字匹配，否则回退第一个链接
      for (var i = 0; i < navLinks.length; i++) {
        var lt = navLinks[i].textContent.toLowerCase();
        if (sectionText.indexOf(lt) !== -1 || lt.indexOf('home') !== -1 && sectionText.indexOf('about') !== -1) {
          return navLinks[i];
        }
      }
      return null;
    }

    var activeLink = null;
    function setActive(link) {
      if (activeLink === link) return;
      navLinks.forEach(function (a) { a.classList.remove('nav-active'); });
      if (link) link.classList.add('nav-active');
      activeLink = link;
    }

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          var text = entry.target.textContent.toLowerCase();
          var link = matchNav(text);
          // 如果找不到精确匹配，高亮第一个 nav（Homepage）
          setActive(link || navLinks[0]);
        }
      });
    }, { rootMargin: '-15% 0px -70% 0px', threshold: 0 });

    headings.forEach(function (h) { io.observe(h); });
  });

  /* ── 鼠标金火花 ── */
  var COLORS = ['#ffe8a0','#f0c860','#c9a84c','#ffd060','#e8b840'];
  var last = 0;
  document.addEventListener('mousemove', function (e) {
    var now = Date.now();
    if (now - last < 45) return;
    last = now;
    var s = document.createElement('div');
    s.className = 'g-spark';
    var sz = (Math.random() * 5 + 2).toFixed(1);
    var c  = COLORS[Math.floor(Math.random() * COLORS.length)];
    s.style.cssText =
      'left:' + e.clientX + 'px;top:' + e.clientY + 'px;' +
      'width:' + sz + 'px;height:' + sz + 'px;' +
      'background:' + c + ';box-shadow:0 0 5px ' + c + ';';
    document.body.appendChild(s);
    setTimeout(function () { s.parentNode && s.parentNode.removeChild(s); }, 750);
  });
})();
</script>
